<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-labelledby="title desc">
<title id="title">The AI-assisted QA loop</title>
<desc id="desc">Understand, design, execute, human review, improve. Decorative animation, not live test results.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#070e1b"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#5cf2c5"/><stop offset="1" stop-color="#7bbcff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#145e63" stop-opacity=".48"/><stop offset="1" stop-color="#0a1423" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 H 0 V 36" fill="none" stroke="#7bbcff" stroke-opacity=".055"/></pattern>
  <clipPath id="frame"><rect width="1200" height="168" rx="20"/></clipPath>
</defs>
<style>
text { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace; }
.title { font-family: 'Arial Black', 'DejaVu Sans', sans-serif; font-weight: 900; }
.orbit { transform-origin: 930px 219px; animation: orbit 24s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 36s; }
.pulse { animation: pulse 3s ease-in-out infinite; }
.cursor { animation: cursor 1.4s steps(1) infinite; }
.flow { stroke-dasharray: 9 15; animation: flow 3s linear infinite; }
.trace { stroke-dasharray: 700; animation: trace 5s ease-in-out infinite; }
.scan { animation: scan 5s ease-in-out infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
@keyframes cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -96; } }
@keyframes trace { 0% { stroke-dashoffset: 700; } 65%,100% { stroke-dashoffset: 0; } }
@keyframes scan { 0%,100% { transform: translateX(0); opacity: .3; } 50% { transform: translateX(350px); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .orbit,.pulse,.cursor,.flow,.trace,.scan { animation: none; } }
</style>
<g clip-path="url(#frame)">
<rect x="0" y="0" width="1200" height="168" rx="20" fill="url(#bg)" />
<rect x="0" y="0" width="1200" height="168" rx="0" fill="url(#grid)" />
<text x="30" y="31" font-size="12" fill="#5cf2c5" class="" letter-spacing="2">THE QA LOOP</text><text x="1170" y="31" font-size="11" fill="#a0b5c8" class="" text-anchor="end">AI-ASSISTED. HUMAN-REVIEWED.</text><line x1="120" y1="84" x2="1080" y2="84" stroke="#5cf2c5" class="flow" stroke-width="2"/><rect x="28" y="56" width="192" height="88" rx="10" fill="#0e1d2c" stroke="#5cf2c5" stroke-opacity=".35"/><text x="42" y="79" font-size="11" fill="#5cf2c5" class="pulse" style="animation-delay:0.0s">01</text><text x="42" y="104" font-size="15" fill="#eaf3ff" class="" >UNDERSTAND</text><text x="42" y="127" font-size="11" fill="#a0b5c8" class="" >Requirements + risks</text><rect x="266" y="56" width="192" height="88" rx="10" fill="#0e1d2c" stroke="#5cf2c5" stroke-opacity=".35"/><text x="280" y="79" font-size="11" fill="#5cf2c5" class="pulse" style="animation-delay:0.6s">02</text><text x="280" y="104" font-size="15" fill="#eaf3ff" class="" >DESIGN</text><text x="280" y="127" font-size="11" fill="#a0b5c8" class="" >Scenarios + cases</text><rect x="504" y="56" width="192" height="88" rx="10" fill="#0e1d2c" stroke="#5cf2c5" stroke-opacity=".35"/><text x="518" y="79" font-size="11" fill="#5cf2c5" class="pulse" style="animation-delay:1.2s">03</text><text x="518" y="104" font-size="15" fill="#eaf3ff" class="" >EXECUTE</text><text x="518" y="127" font-size="11" fill="#a0b5c8" class="" >Checks + evidence</text><rect x="742" y="56" width="192" height="88" rx="10" fill="#0e1d2c" stroke="#ffd18b" stroke-opacity=".35"/><text x="756" y="79" font-size="11" fill="#ffd18b" class="pulse" style="animation-delay:1.7999999999999998s">04</text><text x="756" y="104" font-size="15" fill="#eaf3ff" class="" >REVIEW</text><text x="756" y="127" font-size="11" fill="#a0b5c8" class="" >Human judgment</text><rect x="980" y="56" width="192" height="88" rx="10" fill="#0e1d2c" stroke="#5cf2c5" stroke-opacity=".35"/><text x="994" y="79" font-size="11" fill="#5cf2c5" class="pulse" style="animation-delay:2.4s">05</text><text x="994" y="104" font-size="15" fill="#eaf3ff" class="" >IMPROVE</text><text x="994" y="127" font-size="11" fill="#a0b5c8" class="" >Regression + reports</text>
</g>
<rect x="1" y="1" width="1198" height="166" rx="19" fill="none" stroke="#2c4054"/>
</svg>
