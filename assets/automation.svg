<svg xmlns="http://www.w3.org/2000/svg" width="580" height="246" viewBox="0 0 580 246" role="img" aria-labelledby="title desc">
<title id="title">TEST AUTOMATION</title>
<desc id="desc">Repeat the checks. Keep the evidence.. WEB + APP / REGRESSION / ASSERTIONS</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#070e1b"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#5cf2c5"/><stop offset="1" stop-color="#7bbcff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#145e63" stop-opacity=".48"/><stop offset="1" stop-color="#0a1423" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 H 0 V 36" fill="none" stroke="#7bbcff" stroke-opacity=".055"/></pattern>
  <clipPath id="frame"><rect width="580" height="246" rx="20"/></clipPath>
</defs>
<style>
text { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace; }
.title { font-family: 'Arial Black', 'DejaVu Sans', sans-serif; font-weight: 900; }
.orbit { transform-origin: 930px 219px; animation: orbit 24s linear infinite; }
.reverse { animation-direction: reverse; animation-duration: 36s; }
.pulse { animation: pulse 3s ease-in-out infinite; }
.cursor { animation: cursor 1.4s steps(1) infinite; }
.flow { stroke-dasharray: 9 15; animation: flow 3s linear infinite; }
.trace { stroke-dasharray: 700; animation: trace 5s ease-in-out infinite; }
.scan { animation: scan 5s ease-in-out infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
@keyframes cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -96; } }
@keyframes trace { 0% { stroke-dashoffset: 700; } 65%,100% { stroke-dashoffset: 0; } }
@keyframes scan { 0%,100% { transform: translateX(0); opacity: .3; } 50% { transform: translateX(350px); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .orbit,.pulse,.cursor,.flow,.trace,.scan { animation: none; } }
</style>
<g clip-path="url(#frame)">
<rect x="0" y="0" width="580" height="246" rx="20" fill="url(#bg)" />
<rect x="0" y="0" width="580" height="246" rx="0" fill="url(#grid)" />
<text x="26" y="31" font-size="11" fill="#5cf2c5" class="" letter-spacing="1.8">QUALITY LAB / 03</text><text x="26" y="68" font-size="26" fill="#eaf3ff" class="title" >TEST AUTOMATION</text><text x="26" y="94" font-size="13" fill="#a0b5c8" class="" >Repeat the checks. Keep the evidence.</text><text x="546" y="64" font-size="53" fill="#1d3146" class="title" text-anchor="end">03</text><line x1="26" y1="114" x2="554" y2="114" stroke="#243a4c" /><rect x="28" y="129" width="524" height="72" rx="7" fill="#0a1523" stroke="#2c4054"/><rect x="36" y="137" width="148" height="4" rx="2" fill="#243a4c" /><rect x="47" y="156" width="135" height="27" rx="5" fill="#142b32" /><text x="59" y="174" font-size="11" fill="#5cf2c5" class="" >+ WEB</text><circle cx="166" cy="170" r="3" fill="#5cf2c5" class="pulse" style="animation-delay:0.0s"/><rect x="216" y="156" width="135" height="27" rx="5" fill="#142b32" /><text x="228" y="174" font-size="11" fill="#5cf2c5" class="" >+ APP</text><circle cx="335" cy="170" r="3" fill="#5cf2c5" class="pulse" style="animation-delay:0.6s"/><rect x="385" y="156" width="135" height="27" rx="5" fill="#142b32" /><text x="397" y="174" font-size="11" fill="#5cf2c5" class="" >+ API</text><circle cx="504" cy="170" r="3" fill="#5cf2c5" class="pulse" style="animation-delay:1.2s"/><rect x="38" y="146" width="130" height="46" rx="3" fill="url(#halo)" class="scan"/><text x="26" y="225" font-size="11" fill="#5cf2c5" class="" letter-spacing=".5">WEB + APP / REGRESSION / ASSERTIONS</text>
</g>
<rect x="1" y="1" width="578" height="244" rx="19" fill="none" stroke="#2c4054"/>
</svg>
